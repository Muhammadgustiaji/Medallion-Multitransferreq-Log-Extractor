# Example configuration: override Redis settings in the Logstash environment.
input {
  redis {
    host => "${REDIS_HOST:127.0.0.1}"
    port => "${REDIS_PORT:6379}"
    data_type => "list"
    key => "log-medallion-multitransferreq"
    codec => "json"
  }
}

filter {
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:log_timestamp},%{NUMBER:log_timestamp_ms} \[\[%{WORD:thread_state}\] ExecuteThread: '%{NUMBER:thread_num}' for queue: '%{DATA:queue_name}'\]\[%{NUMBER:process_id}\] %{LOGLEVEL:log_level}\s+%{DATA:logger_class}\s+%{NUMBER:line_code} - (aaawebservice group=%{DATA:group}, command=%{DATA:command}, mpMap=\{channel=\{Reference=%{NUMBER:reference}, ChannelID=%{DATA:channel_id}, ClientSupervisorID=%{NUMBER:client_supervisor_id}, ClientUserID=%{NUMBER:client_user_id}\}, bean=\{.*?systemId=%{DATA:system_id}, accountNum1=%{NUMBER:account_num1},.*?txnType_1=%{DATA:txn_type1}, keyWs=%{NOTSPACE:key_ws}, countTrans=%{NUMBER:count_trans}, amount_1=%{NUMBER:amount_1}, narative1=%{DATA:narative1}, rateType=%{NUMBER:rate_type}, narative2=%{DATA:narative2}, highestAmount=%{NUMBER:highest_amount}, narative3=%{DATA:narative3}.*?entrySum_1=%{NUMBER:entry_sum}, systemJournal=%{NUMBER:system_journal}.*?entrysType=%{DATA:entries_type}, tranType1_1=%{NUMBER:tran_type1_1}\}, uuids=\{.*?\}\}, userId%{NUMBER:user_id}|aaawebservice group=%{DATA:group}, command=%{DATA:command}, mpMap=\{channel=\{Reference=%{DATA:reference}, ChannelID=%{DATA:channel_id}, ClientSupervisorID=%{NUMBER:client_supervisor_id}, ClientUserID=%{NUMBER:client_user_id}\}, bean=\{.*?systemId=%{DATA:system_id},.*?acctno=%{DATA:inquiry_acctno},.*?systemJournal=%{NUMBER:system_journal}\}, uuids=\{.*?\}\}, userId%{NUMBER:user_id}|Outbound message: .*?<systemId>%{DATA:out_system_id}</systemId>.*?<EntriesType>%{DATA:out_entries_type}</EntriesType><RateType>%{NUMBER:out_rate_type}</RateType><Narative1>%{DATA:out_narative1}</Narative1><Narative2>%{DATA:out_narative2}</Narative2><Narative3>%{DATA:out_narative3}</Narative3><HighestAmount>%{NUMBER:out_highest_amount}</HighestAmount>.*?<AccountNum_1>%{DATA:out_debit_acc}</AccountNum_1><TxnType_1>%{DATA:out_debit_type}</TxnType_1><Amount_1>%{NUMBER:out_debit_amount}</Amount_1>.*?<AccountNum_2>%{DATA:out_credit_acc}</AccountNum_2><TxnType_2>%{DATA:out_credit_type}</TxnType_2><Amount_2>%{NUMBER:out_credit_amount}</Amount_2><NetTotal>%{NUMBER:out_net_total}</NetTotal>.*|Outbound message: .*?<systemId>%{DATA:out_system_id}</systemId>.*?<accountNum>%{DATA:out_inquiry_account}</accountNum>.*|Inbound message: .*?<coreJournal>%{NUMBER:in_core_journal}</coreJournal>.*?<Result>%{NUMBER:in_result_code}</Result><JournalNum>%{NUMBER:in_journal_num}</JournalNum><ResponseDate>%{NUMBER:in_response_date}</ResponseDate><ResponseTime>%{TIME:in_response_time}</ResponseTime>.*?<Account_1>%{DATA:in_account_1}</Account_1><AccountName_1>%{DATA:in_account_name_1}</AccountName_1><HomeBranch_1>%{NUMBER:in_branch_1}</HomeBranch_1><Account_2>%{DATA:in_account_2}</Account_2><AccountName_2>%{DATA:in_account_name_2}</AccountName_2><HomeBranch_2>%{NUMBER:in_branch_2}</HomeBranch_2>.*?<ResponseCount>%{NUMBER:in_response_count}</ResponseCount>.*|Inbound message: .*?<customerName>%{DATA:in_customer_name}</customerName>.*?<balance>%{NUMBER:in_balance}</balance>.*?<status>%{DATA:in_account_status}</status>.*?<accountType>%{DATA:in_account_type}</accountType>.*|Inbound message: .*?<faultcode>%{DATA:fault_code}</faultcode>.*?<faultstring>%{DATA:fault_string}</faultstring>(?:.*?<errorDescription>%{DATA:error_description}</errorDescription>)?.*)"
    }
  }

  mutate {
    gsub => [ "settlement_unit", ",", "" ]
    convert => {
      "line" => "integer"
      "settlement_unit" => "integer"
    }
  }
}

output {
  stdout {
    codec => rubydebug
  }
}
